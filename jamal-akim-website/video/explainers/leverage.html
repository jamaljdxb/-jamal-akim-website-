<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Leverage Explainer</title>
<style>
  @font-face{font-family:"Inter Tight";src:url(../assets/fonts/inter-tight-latin-800-normal.woff2);font-weight:800}
  @font-face{font-family:"Inter Tight";src:url(../assets/fonts/inter-tight-latin-700-normal.woff2);font-weight:700}
  @font-face{font-family:"IBM Plex Mono";src:url(../assets/fonts/ibm-plex-mono-latin-500-normal.woff2);font-weight:500}
  html,body{margin:0;background:#08090a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// "Developer vs resale: leverage" explainer. Contract: setup(mode, durations) -> total seconds,
// renderFrame(t). Modes: 'v' 1080x1920 (TikTok, Reels, Shorts), 'sq' 1080x1080 (LinkedIn feed),
// 'h' 1920x1080 (YouTube, LinkedIn, website). One scene per voiceover line; durations come from
// the measured VO clips plus padding.
const P = { ink: '#08090a', ink2: '#141619', white: '#ffffff', grey: '#9a9ea2', line: '#2a2d31', brass: '#a98a52', brass2: '#c9a96a' };
const VO = [
  'Why would I pay the developer 1.35 million more, when resale is cheaper?',
  'On paper, it makes zero sense. In reality? It\'s all about leverage.',
  'Resale at 7.9 million. You refund the seller\'s 35 percent. Plus the premium, fees and agency. 3.15 million on day one.',
  'Developer at 9.25 million. Ten percent down. No agency. No premium. 1.1 million on day one.',
  'That\'s two million less cash, today.',
  'Before completion, you\'re selling to investors. And your profit is their discount.',
  'At completion, the buyer pool changes. Mortgage buyers and end users arrive. That\'s when you get a fair price.',
  'Developers give you time. Banks give end users time. Investors want cash, today.',
  'Same unit. Different cash. Different buyer. Different outcome. Full breakdown on jamalakim.com.',
];
let c, ctx, W, H, s, mode, D = [], starts = [], TOTAL = 0;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function font(w, size) { ctx.font = `${w} ${size}px "Inter Tight"`; ctx.letterSpacing = `${-0.03 * size}px`; }
function mono(size) { ctx.font = `500 ${size}px "IBM Plex Mono"`; ctx.letterSpacing = `${0.12 * size}px`; }
function text(str, x, y, { size = 80, w = 800, color = P.white, align = 'left', alpha = 1, m = false } = {}) {
  ctx.save(); m ? mono(size) : font(w, size); ctx.fillStyle = color; ctx.globalAlpha *= alpha; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(m ? str.toUpperCase() : str, x, y); ctx.restore();
}
function fit(str, maxW, maxSize, w = 800) { font(w, maxSize); const m = ctx.measureText(str).width; return m > maxW ? maxSize * maxW / m : maxSize; }
// masked rise-in for a headline line
function rise(str, x, y, size, t, { color = P.white, align = 'left', w = 800 } = {}) {
  const p = eo(seg(t, 0, .55));
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - size * 1.0, W, size * 1.25); ctx.clip();
  text(str, x, y + (1 - p) * size * 1.1, { size, color, align, w }); ctx.restore();
}
const fmt = v => (v >= 1e6 ? (v / 1e6).toFixed(2).replace(/0$/, '') + 'M' : Math.round(v / 1e3) + 'K');

function setup(m, durs) {
  mode = m; c = document.getElementById('c');
  W = c.width = m === 'h' ? 1920 : 1080; H = c.height = m === 'v' ? 1920 : 1080;
  ctx = c.getContext('2d'); s = Math.min(W, H) / 1080;
  D = durs && durs.length === VO.length ? durs : VO.map(v => 2.2 + v.split(' ').length * 0.38);
  starts = []; let acc = 0; for (const d of D) { starts.push(acc); acc += d; } TOTAL = acc;
  return TOTAL;
}

// frame chrome: logo, coordinates, progress ticks, caption
function chrome(T, i) {
  const pad = 64 * s;
  text('JAMAL AKIM', pad, pad + 20 * s, { size: 22 * s, m: true, color: P.white });
  text('N 24.4539°  E 54.3773°', W - pad, pad + 20 * s, { size: 18 * s, m: true, color: P.grey, align: 'right' });
  // progress
  const pw = W - pad * 2, py = H - pad;
  ctx.fillStyle = P.line; ctx.fillRect(pad, py, pw, 3 * s);
  ctx.fillStyle = P.brass; ctx.fillRect(pad, py, pw * clamp(T / TOTAL), 3 * s);
  // caption (for muted autoplay)
  const lt = T - starts[i], cap = VO[i];
  const capSize = (mode === 'h' ? 30 : 34) * s, maxW = W - pad * 2;
  font(600, capSize); const words = cap.split(' '); const lines = []; let cur = '';
  for (const w of words) { const t2 = cur ? cur + ' ' + w : w; if (ctx.measureText(t2).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t2; }
  lines.push(cur);
  const a = eo(seg(lt, .05, .35)) * (1 - seg(lt, D[i] - .25, D[i]));
  lines.forEach((l, k) => text(l, W / 2, py - 30 * s - (lines.length - 1 - k) * capSize * 1.3, { size: capSize, w: 700, color: P.grey, align: 'center', alpha: a }));
}

function bar(x, y, w, h, frac, color) { ctx.fillStyle = P.ink2; ctx.fillRect(x, y, w, h); ctx.fillStyle = color; ctx.fillRect(x, y, w * frac, h); }

function scene(i, lt) {
  const pad = 64 * s, cx = W / 2, cw = W - pad * 2;
  const top = mode === 'v' ? H * .28 : H * .30;
  const big = mode === 'h' ? 150 : 170;
  switch (i) {
    case 0: {
      text('Developer vs resale', pad, top - 40 * s, { size: 26 * s, m: true, color: P.brass2, alpha: eo(seg(lt, 0, .4)) });
      const sz = fit('AED 1.35M', cw, big * s * 1.25);
      rise('Why pay', pad, top + 120 * s, big * .62 * s, lt);
      rise('AED 1.35M', pad, top + 120 * s + sz * 1.05, sz, lt - .25, { color: P.brass2 });
      rise('more?', pad, top + 120 * s + sz * 1.05 + big * .7 * s, big * .62 * s, lt - .5);
      break;
    }
    case 1: {
      rise('On paper:', pad, top + 60 * s, 70 * s, lt, { color: P.grey });
      rise('zero sense.', pad, top + 140 * s, 70 * s, lt - .15, { color: P.grey });
      const t2 = lt - 1.6, sz = fit('LEVERAGE', cw, big * 1.15 * s);
      if (t2 > 0) {
        rise('In reality:', pad, top + 300 * s, 70 * s, t2);
        const y = top + 300 * s + sz * 1.1;
        ctx.fillStyle = P.brass; ctx.fillRect(pad - 10 * s, y - sz * .82, (cw + 20 * s) * eo(seg(t2, .4, 1)), sz * .98);
        rise('LEVERAGE', pad, y, sz, t2 - .3, { color: P.ink });
      }
      break;
    }
    case 2: case 3: {
      const resale = i === 2;
      const price = resale ? 7.9e6 : 9.25e6;
      const parts = resale
        ? [['Refund seller 35%', 2.765e6], ['Seller premium', 0.1e6], ['Registration 2%', 0.158e6], ['Agency 2% + VAT', 0.166e6]]
        : [['Down payment 10%', 0.925e6], ['Registration 2%', 0.185e6], ['Agency', 0], ['Premium', 0]];
      text(resale ? 'Resale' : 'Developer direct', pad, top - 40 * s, { size: 26 * s, m: true, color: P.brass2, alpha: eo(seg(lt, 0, .4)) });
      rise('AED ' + fmt(price), pad, top + 90 * s, 110 * s, lt);
      const v = mode === 'v', rowH = (v ? 92 : 52) * s, rowW = mode === 'h' ? W * .5 - pad : cw, rs = (v ? 34 : 28) * s;
      let y0 = top + (v ? 190 : 160) * s;
      parts.forEach(([label, val], k) => {
        const a = eo(seg(lt, .8 + k * .55, 1.2 + k * .55));
        text(label, pad, y0 + k * rowH, { size: rs, w: 700, color: val ? P.white : P.grey, alpha: a });
        text(val ? 'AED ' + fmt(val) : 'none', pad + rowW, y0 + k * rowH, { size: rs, w: 700, color: val ? P.white : P.grey, align: 'right', alpha: a });
        ctx.fillStyle = P.line; ctx.globalAlpha = a; ctx.fillRect(pad, y0 + k * rowH + 18 * s, rowW, 1.5 * s); ctx.globalAlpha = 1;
      });
      const show = seg(lt, .8 + parts.length * .55, 1.2 + parts.length * .55);
      const total = resale ? 3.15e6 : 1.11e6, shown = total * eo(show);
      const label = 'AED ' + (shown >= 1e6 ? (shown / 1e6).toFixed(2) + 'M' : Math.round(shown / 1e3) + 'K');
      let tx = pad, ty = y0 + parts.length * rowH + (v ? 70 : 40) * s, ts = (v ? 120 : 92) * s;
      if (mode === 'h') { tx = W * .58; ty = top + 60 * s; ts = 150 * s; }
      text('Day-one cash', tx, ty, { size: 24 * s, m: true, color: P.grey, alpha: show });
      text(label, tx, ty + ts * 1.0, { size: ts, color: resale ? P.white : P.brass2, alpha: show });
      break;
    }
    case 4: {
      const bw = mode === 'h' ? 260 * s : mode === 'sq' ? 170 * s : 220 * s;
      const baseY = mode === 'v' ? H * .80 : H * .76, maxH = mode === 'v' ? 560 * s : mode === 'sq' ? 440 * s : 480 * s;
      const g = eo(seg(lt, .1, 1.1));
      const bx = mode === 'h' ? W * .2 : mode === 'sq' ? W * .52 : pad + 40 * s;
      const xs = [bx, bx + bw + 70 * s];
      [[3.15, 'Resale', P.grey], [1.11, 'Developer', P.brass]].forEach(([v, l, col], k) => {
        const h = maxH * v / 3.15 * g; ctx.fillStyle = col; ctx.fillRect(xs[k], baseY - h, bw, h);
        text('AED ' + v.toFixed(2) + 'M', xs[k], baseY - h - 24 * s, { size: 40 * s, w: 800, alpha: g });
        text(l, xs[k], baseY + 50 * s, { size: 22 * s, m: true, color: P.grey });
      });
      const tx = mode === 'h' ? W * .58 : pad, ty = mode === 'h' ? H * .42 : mode === 'sq' ? H * .40 : top + 10 * s;
      const sz = mode === 'h' ? 130 * s : mode === 'sq' ? 100 * s : 120 * s;
      rise('AED 2M', tx, ty, sz, lt - .5, { color: P.brass2 });
      rise('less cash', tx, ty + sz * .95, sz * .62, lt - .7);
      rise('today.', tx, ty + sz * .95 + sz * .62, sz * .62, lt - .9);
      break;
    }
    case 5: case 6: {
      // four phases timeline
      const names = ['Off-plan', 'Construction', 'Completion', 'Maturity'], who = ['Investors', 'Investors', 'Leveraged buyers', 'End users'];
      const vertical = mode === 'v';
      const prog = i === 5 ? .33 * eo(seg(lt, .2, 1.4)) : .33 + .67 * eo(seg(lt, .3, 2.2));
      text('4 phases of price appreciation', pad, top - 40 * s, { size: 24 * s, m: true, color: P.brass2 });
      if (vertical) {
        const x = pad + 24 * s, y0 = top + 60 * s, gap = 230 * s;
        ctx.fillStyle = P.line; ctx.fillRect(x - 3 * s, y0, 6 * s, gap * 3);
        ctx.fillStyle = P.brass; ctx.fillRect(x - 3 * s, y0, 6 * s, gap * 3 * prog);
        names.forEach((n, k) => {
          const on = prog >= k / 3 - .001, y = y0 + gap * k, hi = k >= 2 && i === 6;
          ctx.fillStyle = on ? (k >= 2 ? P.brass2 : P.white) : P.line; ctx.beginPath(); ctx.arc(x, y, 18 * s, 0, 7); ctx.fill();
          text(n, x + 56 * s, y + 4 * s, { size: 56 * s, color: on ? P.white : P.grey });
          text(who[k], x + 56 * s, y + 58 * s, { size: 26 * s, m: true, color: hi ? P.brass2 : P.grey });
        });
      } else {
        const y = mode === 'h' ? H * .44 : H * .46, x0 = pad + 90 * s, x1 = W - pad - 90 * s, gap = (x1 - x0) / 3;
        ctx.fillStyle = P.line; ctx.fillRect(x0, y - 3 * s, x1 - x0, 6 * s);
        ctx.fillStyle = P.brass; ctx.fillRect(x0, y - 3 * s, (x1 - x0) * prog, 6 * s);
        const ns = (mode === 'h' ? 40 : 30) * s, ws = (mode === 'h' ? 20 : 16) * s;
        names.forEach((n, k) => {
          const on = prog >= k / 3 - .001, x = x0 + gap * k, hi = k >= 2 && i === 6;
          ctx.fillStyle = on ? (k >= 2 ? P.brass2 : P.white) : P.line; ctx.beginPath(); ctx.arc(x, y, 16 * s, 0, 7); ctx.fill();
          text(n, x, y - 40 * s, { size: ns, color: on ? P.white : P.grey, align: 'center' });
          text(who[k], x, y + 60 * s, { size: ws, m: true, color: hi ? P.brass2 : P.grey, align: 'center' });
        });
      }
      const ky = vertical ? top + 60 * s + 230 * s * 3 + 180 * s : H * .72;
      const lines = i === 5 ? ['Your profit =', 'their discount.'] : ['That\'s when you', 'get a fair price.'];
      const ksz = (mode === 'v' ? 84 : 64) * s;
      rise(lines[0], pad, ky, ksz, lt - (i === 5 ? 1.6 : 2.4), { color: i === 5 ? P.white : P.brass2 });
      rise(lines[1], pad, ky + ksz * 1.05, ksz, lt - (i === 5 ? 1.8 : 2.6), { color: i === 5 ? P.white : P.brass2 });
      break;
    }
    case 7: {
      const rows = [['Developers', 'give you time.'], ['Banks', 'give end users time.'], ['Investors', 'want cash today.']];
      const rh = (mode === 'v' ? 300 : mode === 'h' ? 200 : 185) * s, sz = (mode === 'v' ? 96 : mode === 'h' ? 80 : 70) * s;
      rows.forEach(([a, b], k) => {
        const t0 = lt - k * (D[7] / 3.4);
        rise(a, pad, top + (mode === 'v' ? 40 : -20) * s + k * rh, sz, t0, { color: k === 2 ? P.grey : P.brass2 });
        rise(b, pad, top + (mode === 'v' ? 40 : -20) * s + k * rh + sz * .9, sz * .6, t0 - .15);
      });
      break;
    }
    case 8: {
      const words = ['Same unit.', 'Different cash.', 'Different buyer.', 'Different outcome.'];
      const sz = (mode === 'h' ? 92 : 96) * s;
      words.forEach((w, k) => rise(w, pad, top + k * sz * 1.08, sz, lt - k * .45, { color: k === 3 ? P.brass2 : P.white }));
      const a = eo(seg(lt, 2.4, 3));
      const yb = mode === 'v' ? H * .70 : H * .78;
      text('Full breakdown', pad, yb, { size: 24 * s, m: true, color: P.grey, alpha: a });
      text('jamalakim.com', pad, yb + 70 * s, { size: 64 * s, color: P.white, alpha: a });
      text('Illustrative Abu Dhabi example · Not financial advice', pad, yb + 120 * s, { size: 16 * s, m: true, color: P.grey, alpha: a });
      break;
    }
  }
}

function renderFrame(T) {
  ctx.fillStyle = P.ink; ctx.fillRect(0, 0, W, H);
  // subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.035)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 120 * s) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  let i = starts.findIndex((st, k) => T >= st && T < st + D[k]); if (i < 0) i = VO.length - 1;
  const lt = T - starts[i];
  // scene fade between scenes
  ctx.save(); ctx.globalAlpha = 1 - seg(lt, D[i] - .2, D[i]) * (i < VO.length - 1 ? 1 : 0);
  scene(i, lt); ctx.restore();
  // brass wipe on each cut
  const cut = seg(lt, 0, .22); if (i > 0 && cut < 1) { ctx.fillStyle = P.brass; ctx.fillRect(0, 0, W * (1 - eio(cut)), 6 * s); }
  chrome(T, i);
}
window.setup = setup; window.renderFrame = renderFrame;
window.fontsReady = Promise.all([document.fonts.load('800 40px "Inter Tight"'), document.fonts.load('700 40px "Inter Tight"'), document.fonts.load('500 40px "IBM Plex Mono"')]);
</script>
</body>
</html>
